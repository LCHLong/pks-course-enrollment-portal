name: CI Quality Gate & Build Verification

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Copy sample environment if not present
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Client Typecheck & Build (Catch TS6133 & Vite errors)
        run: npm run build:client

      - name: Server Typecheck & Build
        run: npm run build:server

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Run DAST Security Audit
        run: npm run dast
